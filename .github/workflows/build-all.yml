name: Build All Platforms

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

env:
  TDESKTOP_API_ID: 2040
  TDESKTOP_API_HASH: b18441a1ff607e10a989891a5462e627

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      release_name: ${{ steps.release_info.outputs.release_name }}
      release_title: ${{ steps.release_info.outputs.release_title }}
      commit_sha: ${{ steps.release_info.outputs.commit_sha }}
      timestamp: ${{ steps.release_info.outputs.timestamp }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate release info
        id: release_info
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          RELEASE_NAME="CI-${COMMIT_SHA}-${TIMESTAMP}"
          RELEASE_TITLE="CI Build ${COMMIT_SHA} (${TIMESTAMP})"

          echo "commit_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "release_name=${RELEASE_NAME}" >> $GITHUB_OUTPUT
          echo "release_title=${RELEASE_TITLE}" >> $GITHUB_OUTPUT

  build-linux:
    runs-on: ubuntu-latest
    needs: prepare-release
    permissions:
      contents: write
    timeout-minutes: 1440
    container:
      image: ghcr.io/telegramdesktop/tdesktop/centos_env:latest
      options: --user 0

    steps:
      - name: Force clean workspace
        run: |
          echo "Forcing workspace cleanup..."
          sudo chown -R $USER:$USER . || true
          sudo rm -rf ./* .ccache .git* || true
          sudo find . -path . -prune -o -exec rm -rf {} + || true

      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Sync with upstream repository
        run: |
          git remote add upstream ${{ github.server_url }}/${{ github.repository }}.git || true

          PRESERVE_BACKUP_ROOT="/tmp/preserve-backup-$$"
          mkdir -p "$PRESERVE_BACKUP_ROOT"
          for path in docs .github README.md; do
            if [ -e "$path" ]; then
              echo "Backing up $path before reset..."
              cp -a "$path" "$PRESERVE_BACKUP_ROOT/"
            fi
          done

          git fetch upstream --tags --no-recurse-submodules
          git checkout dev

          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          echo "Resetting local dev branch to match upstream/dev..."
          git reset --hard upstream/dev

          CHANGES_MADE=false
          for path in docs .github README.md; do
            if [ -e "$PRESERVE_BACKUP_ROOT/$path" ]; then
              echo "Restoring $path after reset..."
              rm -rf "$path"
              cp -a "$PRESERVE_BACKUP_ROOT/$path" "$path"
              git add "$path" || true
              CHANGES_MADE=true
            fi
          done

          if [ "$CHANGES_MADE" = true ]; then
            if ! git diff --cached --quiet; then
              git commit -m "Preserve local docs and .github during upstream sync [skip ci]"
            fi
          else
            echo "No preserved directories were restored."
          fi

          echo "Force pushing the updated dev branch to origin..."
          git push origin dev --force

      - name: Initialize submodules for upstream/dev
        run: |
          echo "Syncing and updating git submodules..."
          git submodule sync --recursive
          if ! git submodule update --init --force --recursive; then
            echo "Submodule update failed. Suggesting upstream URL for Telegram/lib_ui..."
            git config submodule.Telegram/lib_ui.url https://github.com/desktop-app/lib_ui.git
            git submodule update --init --force --recursive
          fi

      - name: Get latest version and create release tag
        id: get_version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 upstream/dev)
          APP_VERSION=${LATEST_TAG#v}
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          RELEASE_TAG="flatpak-${LATEST_TAG}-${TIMESTAMP}"

          echo "Latest AyuGram tag: ${LATEST_TAG}"
          echo "Application version: ${APP_VERSION}"
          echo "Release tag for this fork: ${RELEASE_TAG}"

          echo "APP_VERSION=${APP_VERSION}" >> $GITHUB_ENV
          echo "LATEST_TAG=${LATEST_TAG}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV
          echo "TIMESTAMP=${TIMESTAMP}" >> $GITHUB_ENV

          UPSTREAM_COMMIT=$(git rev-parse upstream/dev)
          echo "Commit hash upstream/dev: ${UPSTREAM_COMMIT}"
          echo "UPSTREAM_COMMIT=${UPSTREAM_COMMIT}" >> $GITHUB_ENV

      - name: Update metainfo.xml with new release
        run: |
          METAINFO_FILE="docs/assets/flatpak-files/usr/share/metainfo/com.ayugram.desktop.metainfo.xml"
          CURRENT_DATE=$(date +%Y-%m-%d)

          echo "Adding release ${{ env.APP_VERSION }} ($CURRENT_DATE) to $METAINFO_FILE"

          NEW_RELEASE="  <release version=\"${{ env.APP_VERSION }}\" date=\"${CURRENT_DATE}\"><description><p>Automatic Flatpak build. Synchronized with upstream tag ${{ env.LATEST_TAG }}.</p></description></release>"

          if grep -q "<releases>" "$METAINFO_FILE"; then
            sed -i "s|<releases>|<releases>${NEW_RELEASE}|" "$METAINFO_FILE"
          else
            sed -i "s|</component>|<releases>${NEW_RELEASE}</releases></component>|" "$METAINFO_FILE"
          fi

          echo "metainfo.xml updated"

      - name: Verify that required secrets are set
        run: |
          if [ -z "${{ secrets.TDESKTOP_API_ID }}" ] || [ -z "${{ secrets.TDESKTOP_API_HASH }}" ]; then
            echo "::error:: Required secrets TDESKTOP_API_ID and/or TDESKTOP_API_HASH not found or empty."
            exit 1
          else
            echo "Secrets found successfully."
          fi

      - name: Install dependencies and Flatpak SDK
        run: |
          sudo dnf install -y flatpak flatpak-builder python3-pip
          pip3 install --user poetry
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive org.gnome.Sdk//48
          flatpak install --user -y --noninteractive org.gnome.Platform//48

      - name: Cache TDesktop Dependencies
        id: cache-tdesktop-deps
        uses: actions/cache@v4
        with:
          path: Telegram/ThirdParty
          key: ${{ runner.os }}-tdeps-${{ hashFiles('Telegram/build/prepare/dependencies.txt') }}

      - name: Restore Qt6 libraries cache
        id: cache-qt6-restore
        uses: actions/cache/restore@v4
        with:
          path: Libraries/qt6
          key: ${{ runner.os }}-qt6-${{ env.LATEST_TAG }}-${{ hashFiles('Telegram/build/prepare/linux.sh') }}
          restore-keys: |
            ${{ runner.os }}-qt6-${{ env.LATEST_TAG }}-
            ${{ runner.os }}-qt6-

      - name: Inspect Qt6 cache (pre-prepare)
        run: |
          echo "Qt6 cache hit: ${{ steps.cache-qt6-restore.outputs.cache-hit }}"
          if [ -d "Libraries/qt6" ]; then
            echo "Qt6 size (pre):"
            du -sh Libraries/qt6 || true
            echo "Qt6 top-level dirs (pre):"
            ls -1d Libraries/qt6/*/ | head -n 10 || true
          else
            echo "Libraries/qt6 not present (pre)"
          fi

      - name: Prepare libraries
        run: ./Telegram/build/prepare/linux.sh

      - name: Inspect Qt6 cache (post-prepare)
        run: |
          if [ -d "Libraries/qt6" ]; then
            echo "Qt6 size (post):"
            du -sh Libraries/qt6 || true
            echo "Qt6 top-level dirs (post):"
            ls -1d Libraries/qt6/*/ | head -n 10 || true
          else
            echo "Libraries/qt6 not present (post)"
          fi

      - name: Announce Qt6 cache save key
        if: steps.cache-qt6-restore.outputs.cache-hit != 'true'
        run: |
          echo "Saving Qt6 cache with key: ${{ steps.cache-qt6-restore.outputs.cache-primary-key }}"

      - name: Save Qt6 libraries cache
        if: steps.cache-qt6-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Libraries/qt6
          key: ${{ steps.cache-qt6-restore.outputs.cache-primary-key }}

      - name: Cache ccache data
        uses: actions/cache@v4
        id: cache-ccache
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Build AyuGram binary
        env:
          TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          mkdir -p .ccache
          sudo chmod -R 777 .ccache

          docker run --rm \
            --cpus="3" \
            -u root \
            -v "$PWD:/usr/src/tdesktop" \
            -v "$PWD/.ccache:/ccache" \
            ghcr.io/telegramdesktop/tdesktop/centos_env:latest \
            /bin/bash -c "dnf install -y ccache && \
                          export PATH=/usr/lib64/ccache:\$PATH && \
                          export CCACHE_DIR=/ccache && \
                          export CCACHE_BASEDIR=/usr/src/tdesktop && \
                          export CCACHE_COMPRESS=1 && \
                          export CC='ccache gcc' && \
                          export CXX='ccache g++' && \
                          /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
                            -D TDESKTOP_API_ID=${TDESKTOP_API_ID} \
                            -D TDESKTOP_API_HASH=${TDESKTOP_API_HASH} \
                            -D USE_CCACHE=ON && \
                          ccache -s"

      - name: Prepare Flatpak build directory
        run: |
          mkdir -p ayugram-flatpak-build
          cp out/Release/AyuGram ayugram-flatpak-build/
          cp -r docs/assets/flatpak-files/* ayugram-flatpak-build/

      - name: Build Flatpak package
        working-directory: ./ayugram-flatpak-build
        run: |
          rm -rf repo build-dir
          flatpak-builder --repo=repo --force-clean --disable-rofiles-fuse build-dir com.ayugram.desktop.yml
          flatpak build-bundle repo ayugram-desktop-${{ env.APP_VERSION }}.flatpak com.ayugram.desktop

      - name: Prepare artifact
        run: |
          mkdir -p artifacts
          cp ayugram-flatpak-build/ayugram-desktop-${{ env.APP_VERSION }}.flatpak artifacts/AyuGram-linux-x86_64.flatpak

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-linux-x86_64
          path: artifacts/AyuGram-linux-x86_64.flatpak
          retention-days: 7

  build-windows:
    runs-on: windows-2022
    needs: prepare-release

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prepare build environment
        shell: cmd
        run: |
          cd Telegram\build\prepare
          call win.bat

      - name: Apply MSVC PDB patch
        shell: pwsh
        run: |
          Set-Location Telegram\cmake
          @'
          diff --git a/options_win.cmake b/options_win.cmake
          index c2d66cf..ccceb53 100644
          --- a/options_win.cmake
          +++ b/options_win.cmake
          @@ -32,6 +32,7 @@ if (MSVC)
                /utf-8
                /W4
                /MP     # Enable multi process build.
          +        /FS
                /EHsc   # Catch C++ exceptions only, extern C functions never throw a C++ exception.
                /w15038 # wrong initialization order
                /w14265 # class has virtual functions, but destructor is not virtual
          @@ -64,7 +65,7 @@ if (MSVC)
            INTERFACE
                $<$<CONFIG:Debug>:/NODEFAULTLIB:LIBCMT>
                $<$<AND:$<CONFIG:Debug>,$<BOOL:${build_win64}>>:/DEBUG:FASTLINK>
          -        $<$<NOT:$<AND:$<CONFIG:Debug>,$<BOOL:${build_win64}>>>:$<IF:$<STREQUAL:$<GENEX_EVAL:
          $<TARGET_PROPERTY:MSVC_DEBUG_INFORMATION_FORMAT>>,ProgramDatabase>,/DEBUG,/DEBUG:NONE>>
          +        $<$<NOT:$<AND:$<CONFIG:Debug>,$<BOOL:${build_win64}>>>:$<IF:$<BOOL:$<GENEX_EVAL:
          $<TARGET_PROPERTY:MSVC_DEBUG_INFORMATION_FORMAT>>>,/DEBUG,/DEBUG:NONE>>
                $<$<NOT:$<CONFIG:Debug>>:/OPT:REF>
                /INCREMENTAL:NO
                /DEPENDENTLOADFLAG:0x800
          diff --git a/variables.cmake b/variables.cmake
          index d6ac6c5..b2f492a 100644
          --- a/variables.cmake
          +++ b/variables.cmake
          @@ -21,7 +21,9 @@ if (DESKTOP_APP_SPECIAL_TARGET STREQUAL ""
          endif()

          set(CMAKE_CXX_SCAN_FOR_MODULES OFF CACHE BOOL "")
          -set(CMAKE_MSVC_DEBUG_INFORMATION_FORMAT "ProgramDatabase" CACHE STRING "")
          +set(CMAKE_MSVC_DEBUG_INFORMATION_FORMAT
          +    "$<$<CONFIG:Debug,RelWithDebInfo>:ProgramDatabase>$<$<CONFIG:Release,MinSizeRel>:Embedded>"
          +    CACHE STRING "" FORCE)
          set(CMAKE_MSVC_RUNTIME_LIBRARY "MultiThreaded$<$<CONFIG:Debug>:Debug>" CACHE STRING "")
          option(DESKTOP_APP_TEST_APPS "Build test apps, development only." OFF)
          option(DESKTOP_APP_LOTTIE_DISABLE_RECOLORING "Disable recoloring of lottie animations." OFF)
          '@ | git -C cmake apply -

      - name: Configure project
        shell: cmd
        run: |
          cd Telegram
          call configure.bat x64 -D TDESKTOP_API_ID=%TDESKTOP_API_ID% -D TDESKTOP_API_HASH=%TDESKTOP_API_HASH%

      - name: Build project
        shell: cmd
        run: |
          cmake --build out --config Release --target Telegram

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force
          Copy-Item out\Release\AyuGram.exe artifacts\AyuGram-windows-x64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-windows-x64
          path: artifacts/AyuGram-windows-x64.exe
          retention-days: 7

  build-macos:
    runs-on: macos-latest
    needs: prepare-release

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew install git automake cmake wget pkg-config gnu-tar ninja nasm meson

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Prepare build environment
        run: |
          cd Telegram/build/prepare
          ./mac.sh

      - name: Configure project
        run: |
          cd Telegram
          ./configure.sh -D TDESKTOP_API_ID=${{ env.TDESKTOP_API_ID }} -D TDESKTOP_API_HASH=${{ env.TDESKTOP_API_HASH }}

      - name: Build project
        run: |
          cd out
          xcodebuild -project Telegram.xcodeproj -scheme Telegram -configuration Release build

      - name: Prepare artifact
        run: |
          mkdir -p artifacts
          cp -r out/Release/AyuGram.app artifacts/
          cd artifacts
          zip -r AyuGram-macos.zip AyuGram.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-macos
          path: artifacts/AyuGram-macos.zip
          retention-days: 7

  create-release:
    runs-on: ubuntu-latest
    needs: [prepare-release, build-linux, build-windows, build-macos]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.release_name }}
          name: ${{ needs.prepare-release.outputs.release_title }}
          prerelease: true
          files: |
            artifacts/AyuGram-linux-x86_64/AyuGram-linux-x86_64.flatpak
            artifacts/AyuGram-windows-x64/AyuGram-windows-x64.exe
            artifacts/AyuGram-macos/AyuGram-macos.zip
          body: |
            Automated CI build from commit ${{ needs.prepare-release.outputs.commit_sha }}

            Build timestamp: ${{ needs.prepare-release.outputs.timestamp }}

            **Artifacts:**
            - Linux x86_64 Flatpak package
            - Windows x64 executable
            - macOS Universal app (zipped)

            **Note:** These are automated CI builds and may be unstable. Use at your own risk.
          token: ${{ secrets.GITHUB_TOKEN }}
