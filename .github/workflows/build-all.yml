name: Build All Platforms

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

env:
  TDESKTOP_API_ID: 2040
  TDESKTOP_API_HASH: b18441a1ff607e10a989891a5462e627

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      release_name: ${{ steps.release_info.outputs.release_name }}
      release_title: ${{ steps.release_info.outputs.release_title }}
      commit_sha: ${{ steps.release_info.outputs.commit_sha }}
      timestamp: ${{ steps.release_info.outputs.timestamp }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate release info
        id: release_info
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          RELEASE_NAME="CI-${COMMIT_SHA}-${TIMESTAMP}"
          RELEASE_TITLE="CI Build ${COMMIT_SHA} (${TIMESTAMP})"

          echo "commit_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "release_name=${RELEASE_NAME}" >> $GITHUB_OUTPUT
          echo "release_title=${RELEASE_TITLE}" >> $GITHUB_OUTPUT

  build-linux:
    name: Build and Release Flatpak
    runs-on: [self-hosted, yolo]
    container:
      image: ubuntu:24.04
    permissions:
      contents: write
    timeout-minutes: 1440
    needs: prepare-release

    steps:
      - name: Setup Environment
        run: |
          apt update
          apt install -y docker.io git sudo curl

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            env.BUILDKIT_STEP_LOG_MAX_SIZE=10485760
            image=moby/buildkit:latest
          buildkitd-flags: --allow-insecure-entitlement network.host

      - name: Restore TDesktop dependencies cache
        id: cache-tdeps
        uses: actions/cache/restore@v4
        with:
          path: Telegram/ThirdParty
          key: ${{ runner.os }}-tdeps-${{ hashFiles('Telegram/build/prepare/dependencies.txt') }}
          restore-keys: |
            ${{ runner.os }}-tdeps-

      - name: Restore Qt6 libraries cache
        id: cache-qt6
        uses: actions/cache/restore@v4
        with:
          path: Libraries/qt6
          key: ${{ runner.os }}-qt6-${{ hashFiles('Telegram/build/prepare/linux.sh') }}
          restore-keys: |
            ${{ runner.os }}-qt6-

      - name: Restore ccache data
        uses: actions/cache/restore@v4
        id: cache-ccache
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Telegram Desktop build
        run: |
          CONTAINER_ID=$(hostname);

          docker run --rm -i \
            -u root \
            --volumes-from "$CONTAINER_ID" \
            ghcr.io/telegramdesktop/tdesktop/centos_env:latest \
            /bin/bash -s <<DOCKER_SCRIPT
          set -e
          cd "$GITHUB_WORKSPACE";

          dnf install -y ccache
          export PATH=/usr/lib64/ccache:\$PATH
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          export CCACHE_BASEDIR="/usr/src/tdesktop"
          export CCACHE_COMPRESS=1
          export CCACHE_MAXSIZE=10G
          export CC='ccache gcc'
          export CXX='ccache g++'

          ./Telegram/build/docker/centos_env/build.sh \
              -D TDESKTOP_API_ID=${TDESKTOP_API_ID} \
              -D TDESKTOP_API_HASH=${TDESKTOP_API_HASH} \
              -D USE_CCACHE=ON

          ccache -s
          DOCKER_SCRIPT

          sudo chown -R "$(id -u):$(id -g)" .ccache out || true

      - name: Save TDesktop dependencies cache
        if: always() && steps.cache-tdeps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Telegram/ThirdParty
          key: ${{ steps.cache-tdeps.outputs.cache-primary-key }}

      - name: Save Qt6 libraries cache
        if: always() && steps.cache-qt6.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Libraries/qt6
          key: ${{ steps.cache-qt6.outputs.cache-primary-key }}

      - name: Save ccache data
        if: always() && steps.cache-ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ steps.cache-ccache.outputs.cache-primary-key }}

      - name: Check Binary
        run: |
          if [ -f out/Release/AyuGram ]; then
            echo "Build successful."
            ls -lh out/Release/AyuGram
          else
            echo "Build failed: Binary not found."
            ls -lhR out
            exit 1
          fi

      - name: Build Flatpak
        run: |
          CONTAINER_ID=$(hostname)

          docker run --rm -i \
            -u root \
            --volumes-from "$CONTAINER_ID" \
            --privileged \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --security-opt unmask=ALL \
            ghcr.io/flathub-infra/flatpak-github-actions:gnome-48 \
            /bin/bash -s <<DOCKER_SCRIPT
          set -e
          cd "$GITHUB_WORKSPACE"

          mkdir -p ayugram-flatpak-build
          cp out/Release/AyuGram ayugram-flatpak-build/

          if [ -d docs/assets/flatpak-files ]; then
            cp -r docs/assets/flatpak-files/* ayugram-flatpak-build/
          fi

          cd ayugram-flatpak-build
          flatpak-builder --no-sandbox --repo=repo --force-clean --disable-rofiles-fuse build-dir com.ayugram.desktop.yml
          flatpak build-bundle repo ayugram-desktop.flatpak com.ayugram.desktop
          DOCKER_SCRIPT

          ls -alh ayugram-flatpak-build
          sudo chown -R "$(id -u):$(id -g)" ayugram-flatpak-build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-linux-flatpak
          path: ayugram-flatpak-build/ayugram-desktop.flatpak
          retention-days: 7

  build-windows:
    runs-on: windows-2022
    needs: prepare-release

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Increase Pagefile
        shell: pwsh
        run: |
          $NewPageFileSize = 64GB
          $Drive = Get-CimInstance Win32_LogicalDisk | Where-Object { $_.DeviceID -eq "C:" }
          Set-CimInstance -Query "Select * from Win32_PageFileSetting" -Property @{ InitialSize = [int]($NewPageFileSize/1MB); MaximumSize = [int]($NewPageFileSize/1MB) }
          # 如果沒有預設 Pagefile，則創建一個
          if (-not (Get-CimInstance Win32_PageFileSetting)) {
            New-CimInstance -ClassName Win32_PageFileSetting -Property @{ Name = "C:\pagefile.sys"; InitialSize = [int]($NewPageFileSize/1MB); MaximumSize = [int]($NewPageFileSize/1MB) }
          }

      - name: Patch CMake Files
        shell: pwsh
        run: |
          # --- 1. 修改 cmake/options_win.cmake ---
          $optionsFile = "cmake/options_win.cmake"
          if (Test-Path $optionsFile) {
              $optContent = Get-Content $optionsFile -Raw
              $optContent = $optContent -replace '/MP\s+# Enable multi process build\.', "/FS`n                /Zm500"

              # 修正 Debug 判斷式
              $oldExpr = '$<$<NOT:$<AND:$<CONFIG:Debug>,$<BOOL:${build_win64}>>>:$<IF:$<STREQUAL:$<GENEX_EVAL:$<TARGET_PROPERTY:MSVC_DEBUG_INFORMATION_FORMAT>>,ProgramDatabase>,/DEBUG,/DEBUG:NONE>>'
              $newExpr = '$<$<NOT:$<AND:$<CONFIG:Debug>,$<BOOL:${build_win64}>>>:$<IF:$<BOOL:$<GENEX_EVAL:$<TARGET_PROPERTY:MSVC_DEBUG_INFORMATION_FORMAT>>>,/DEBUG,/DEBUG:NONE>>'
              if ($optContent.Contains($oldExpr)) { $optContent = $optContent.Replace($oldExpr, $newExpr) }

              $optContent | Set-Content $optionsFile -Encoding UTF8
          }

          # --- 2. 修改 cmake/variables.cmake ---
          $varsFile = "cmake/variables.cmake"
          if (Test-Path $varsFile) {
              $varsContent = Get-Content $varsFile -Raw
              $oldVar = 'set(CMAKE_MSVC_DEBUG_INFORMATION_FORMAT "ProgramDatabase" CACHE STRING "")'
              # 強制 Release 模式使用 Embedded 減少 PDB 負擔
              $newVar = "set(CMAKE_MSVC_DEBUG_INFORMATION_FORMAT`n        `"`$<$<CONFIG:Debug,RelWithDebInfo>:ProgramDatabase>`$<$<CONFIG:Release,MinSizeRel>:Embedded>`"`n        CACHE STRING `"`" FORCE)"
              if ($varsContent.Contains($oldVar)) { $varsContent = $varsContent.Replace($oldVar, $newVar) }
              $varsContent | Set-Content $varsFile -Encoding UTF8
          }

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prepare build environment
        shell: cmd
        run: |
          cd Telegram\build\prepare
          call win.bat

      - name: Configure project
        shell: cmd
        run: |
          cd Telegram
          call configure.bat x64 -D TDESKTOP_API_ID=%TDESKTOP_API_ID% -D TDESKTOP_API_HASH=%TDESKTOP_API_HASH%

      - name: Build project
        shell: cmd
        run: |
          cmake --build out --config Release --target Telegram -- /m:1

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force
          Copy-Item out\Release\AyuGram.exe artifacts\AyuGram-windows-x64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-windows-x64
          path: artifacts/AyuGram-windows-x64.exe
          retention-days: 7

  build-macos:
    runs-on: macos-latest
    needs: prepare-release

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew install git automake cmake wget pkg-config gnu-tar ninja nasm meson

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Prepare build environment
        run: |
          cd Telegram/build/prepare
          ./mac.sh

      - name: Configure project
        run: |
          cd Telegram
          ./configure.sh -D TDESKTOP_API_ID=${{ env.TDESKTOP_API_ID }} -D TDESKTOP_API_HASH=${{ env.TDESKTOP_API_HASH }}

      - name: Build project
        run: |
          cd out
          xcodebuild -project Telegram.xcodeproj -scheme Telegram -configuration Release build

      - name: Prepare artifact
        run: |
          mkdir -p artifacts
          cp -r out/Release/AyuGram.app artifacts/
          cd artifacts
          zip -r AyuGram-macos.zip AyuGram.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-macos
          path: artifacts/AyuGram-macos.zip
          retention-days: 7

  create-release:
    runs-on: ubuntu-latest
    needs: [prepare-release, build-linux, build-windows, build-macos]

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.release_name }}
          name: ${{ needs.prepare-release.outputs.release_title }}
          prerelease: true
          files: |
            artifacts/AyuGram-linux-x86_64/AyuGram-linux-x86_64.flatpak
            artifacts/AyuGram-windows-x64/AyuGram-windows-x64.exe
            artifacts/AyuGram-macos/AyuGram-macos.zip
          body: |
            Automated CI build from commit ${{ needs.prepare-release.outputs.commit_sha }}

            Build timestamp: ${{ needs.prepare-release.outputs.timestamp }}

            **Artifacts:**
            - Linux x86_64 Flatpak package
            - Windows x64 executable
            - macOS Universal app (zipped)

            **Note:** These are automated CI builds and may be unstable. Use at your own risk.
          token: ${{ secrets.GITHUB_TOKEN }}
