name: Build All Platforms

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

env:
  TDESKTOP_API_ID: 2040
  TDESKTOP_API_HASH: b18441a1ff607e10a989891a5462e627

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      release_name: ${{ steps.release_info.outputs.release_name }}
      release_title: ${{ steps.release_info.outputs.release_title }}
      commit_sha: ${{ steps.release_info.outputs.commit_sha }}
      timestamp: ${{ steps.release_info.outputs.timestamp }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate release info
        id: release_info
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          RELEASE_NAME="CI-${COMMIT_SHA}-${TIMESTAMP}"
          RELEASE_TITLE="CI Build ${COMMIT_SHA} (${TIMESTAMP})"

          echo "commit_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "release_name=${RELEASE_NAME}" >> $GITHUB_OUTPUT
          echo "release_title=${RELEASE_TITLE}" >> $GITHUB_OUTPUT

  build-linux:
    runs-on: ubuntu-latest
    needs: prepare-release
    permissions:
      contents: write

    steps:
      - name: Maximize Disk Space (Aggressive Cleanup)
        run: |
          echo "Before cleanup:"
          df -h
          # 
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          #  Docker  APT 
          docker rmi $(docker images -q) || true
          sudo apt-get clean
          echo "After cleanup:"
          df -h

      - name: Free Disk Space Action
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Initialize submodules
        run: |
          git submodule sync --recursive
          if ! git submodule update --init --force --recursive; then
            git config submodule.Telegram/lib_ui.url https://github.com/desktop-app/lib_ui.git
            git submodule update --init --force --recursive
          fi

      - name: Install Build Essentials
        run: |
          sudo apt update
          sudo apt install -y python3-pip python3-setuptools
          pip3 install --user poetry
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      
      - name: Restore Qt6 libraries cache
        id: cache-qt6-restore
        uses: actions/cache/restore@v4
        with:
          path: Libraries/qt6
          #  LATEST_TAG 
          key: ${{ runner.os }}-qt6-v1-${{ hashFiles('Telegram/build/prepare/linux.sh') }}
          restore-keys: |
            ${{ runner.os }}-qt6-v1-

      - name: Prepare libraries (Build Qt6)
        run: |
          chmod +x Telegram/build/prepare/linux.sh
          ./Telegram/build/prepare/linux.sh
          df -h

      - name: Save Qt6 libraries cache
        if: steps.cache-qt6-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Libraries/qt6
          key: ${{ steps.cache-qt6-restore.outputs.cache-primary-key }}

      - name: Cache ccache data
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Build AyuGram binary (Docker)
        run: |
          mkdir -p .ccache
          sudo chmod -R 777 .ccache
          
          docker run --rm \
            -u $(id -u) \
            -v "$PWD:/usr/src/tdesktop" \
            -v "$PWD/.ccache:/ccache" \
            ghcr.io/telegramdesktop/tdesktop/centos_env:latest \
            /bin/bash -c "dnf install -y ccache && \
                          export PATH=/usr/lib64/ccache:\$PATH && \
                          export CCACHE_DIR=/ccache && \
                          export CCACHE_BASEDIR=/usr/src/tdesktop && \
                          export CCACHE_COMPRESS=1 && \
                          export CC='ccache gcc' && \
                          export CXX='ccache g++' && \
                          /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
                            -D TDESKTOP_API_ID=${{ env.TDESKTOP_API_ID }} \
                            -D TDESKTOP_API_HASH=${{ env.TDESKTOP_API_HASH }} \
                            -D USE_CCACHE=ON && \
                          ccache -s"
          df -h

      - name: Install Flatpak SDK
        run: |
          sudo apt install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.gnome.Sdk//48
          flatpak install --user -y --noninteractive flathub org.gnome.Platform//48

      - name: Prepare Flatpak build directory
        run: |
          mkdir -p ayugram-flatpak-build
          if [ -f out/Release/AyuGram ]; then
            cp out/Release/AyuGram ayugram-flatpak-build/
          else
            echo "Error: AyuGram binary not found!"
            exit 1
          fi
          # 
          if [ -d docs/assets/flatpak-files ]; then
            cp -r docs/assets/flatpak-files/* ayugram-flatpak-build/
          fi

      - name: Build Flatpak package
        working-directory: ./ayugram-flatpak-build
        run: |
          rm -rf repo build-dir
          #  com.ayugram.desktop.yml 
          flatpak-builder --repo=repo --force-clean --disable-rofiles-fuse build-dir com.ayugram.desktop.yml
          flatpak build-bundle repo ayugram-desktop.flatpak com.ayugram.desktop

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-linux-flatpak
          path: ayugram-flatpak-build/ayugram-desktop.flatpak
          retention-days: 7

  build-windows:
    runs-on: windows-2022
    needs: prepare-release

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prepare build environment
        shell: cmd
        run: |
          cd Telegram\build\prepare
          call win.bat

      - name: Apply MSVC PDB patch
        shell: pwsh
        run: |
          @'
          diff --git a/options_win.cmake b/options_win.cmake
          index c2d66cf..ccceb53 100644
          --- a/options_win.cmake
          +++ b/options_win.cmake
          @@ -32,6 +32,7 @@ if (MSVC)
                 /utf-8
                 /W4
                 /MP     # Enable multi process build.
          +        /FS
                 /EHsc   # Catch C++ exceptions only, extern C functions never throw a C++ exception.
                 /w15038 # wrong initialization order
                 /w14265 # class has virtual functions, but destructor is not virtual
          @@ -64,7 +65,7 @@ if (MSVC)
             INTERFACE
                 $<$<CONFIG:Debug>:/NODEFAULTLIB:LIBCMT>
                 $<$<AND:$<CONFIG:Debug>,$<BOOL:${build_win64}>>:/DEBUG:FASTLINK>
          -        $<$<NOT:$<AND:$<CONFIG:Debug>,$<BOOL:${build_win64}>>>:$<IF:$<STREQUAL:$<GENEX_EVAL:$<TARGET_PROPERTY:MSVC_DEBUG_INFORMATION_FORMAT>>,ProgramDatabase>,/DEBUG,/DEBUG:NONE>>
          +        $<$<NOT:$<AND:$<CONFIG:Debug>,$<BOOL:${build_win64}>>>:$<IF:$<BOOL:$<GENEX_EVAL:$<TARGET_PROPERTY:MSVC_DEBUG_INFORMATION_FORMAT>>>,/DEBUG,/DEBUG:NONE>>
                 $<$<NOT:$<CONFIG:Debug>>:/OPT:REF>
                 /INCREMENTAL:NO
                 /DEPENDENTLOADFLAG:0x800
          diff --git a/variables.cmake b/variables.cmake
          index d6ac6c5..b2f492a 100644
          --- a/variables.cmake
          +++ b/variables.cmake
          @@ -21,7 +21,9 @@ if (DESKTOP_APP_SPECIAL_TARGET STREQUAL ""
           endif()
           
           set(CMAKE_CXX_SCAN_FOR_MODULES OFF CACHE BOOL "")
          -set(CMAKE_MSVC_DEBUG_INFORMATION_FORMAT "ProgramDatabase" CACHE STRING "")
          +set(CMAKE_MSVC_DEBUG_INFORMATION_FORMAT
          +    "$<$<CONFIG:Debug,RelWithDebInfo>:ProgramDatabase>$<$<CONFIG:Release,MinSizeRel>:Embedded>"
          +    CACHE STRING "" FORCE)
           set(CMAKE_MSVC_RUNTIME_LIBRARY "MultiThreaded$<$<CONFIG:Debug>:Debug>" CACHE STRING "")
           option(DESKTOP_APP_TEST_APPS "Build test apps, development only." OFF)
           option(DESKTOP_APP_LOTTIE_DISABLE_RECOLORING "Disable recoloring of lottie animations." OFF)
          '@ | git -C "cmake" apply -

      - name: Configure project
        shell: cmd
        run: |
          cd Telegram
          call configure.bat x64 -D TDESKTOP_API_ID=%TDESKTOP_API_ID% -D TDESKTOP_API_HASH=%TDESKTOP_API_HASH%

      - name: Build project
        shell: cmd
        run: |
          cmake --build out --config Release --target Telegram

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force
          Copy-Item out\Release\AyuGram.exe artifacts\AyuGram-windows-x64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-windows-x64
          path: artifacts/AyuGram-windows-x64.exe
          retention-days: 7

  build-macos:
    runs-on: macos-latest
    needs: prepare-release

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew install git automake cmake wget pkg-config gnu-tar ninja nasm meson

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Prepare build environment
        run: |
          cd Telegram/build/prepare
          ./mac.sh

      - name: Configure project
        run: |
          cd Telegram
          ./configure.sh -D TDESKTOP_API_ID=${{ env.TDESKTOP_API_ID }} -D TDESKTOP_API_HASH=${{ env.TDESKTOP_API_HASH }}

      - name: Build project
        run: |
          cd out
          xcodebuild -project Telegram.xcodeproj -scheme Telegram -configuration Release build

      - name: Prepare artifact
        run: |
          mkdir -p artifacts
          cp -r out/Release/AyuGram.app artifacts/
          cd artifacts
          zip -r AyuGram-macos.zip AyuGram.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-macos
          path: artifacts/AyuGram-macos.zip
          retention-days: 7

  create-release:
    runs-on: ubuntu-latest
    needs: [prepare-release, build-linux, build-windows, build-macos]

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.release_name }}
          name: ${{ needs.prepare-release.outputs.release_title }}
          prerelease: true
          files: |
            artifacts/AyuGram-linux-x86_64/AyuGram-linux-x86_64.flatpak
            artifacts/AyuGram-windows-x64/AyuGram-windows-x64.exe
            artifacts/AyuGram-macos/AyuGram-macos.zip
          body: |
            Automated CI build from commit ${{ needs.prepare-release.outputs.commit_sha }}

            Build timestamp: ${{ needs.prepare-release.outputs.timestamp }}

            **Artifacts:**
            - Linux x86_64 Flatpak package
            - Windows x64 executable
            - macOS Universal app (zipped)

            **Note:** These are automated CI builds and may be unstable. Use at your own risk.
          token: ${{ secrets.GITHUB_TOKEN }}
