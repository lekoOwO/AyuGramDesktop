name: Build All Platforms

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

env:
  TDESKTOP_API_ID: 2040
  TDESKTOP_API_HASH: b18441a1ff607e10a989891a5462e627

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      release_name: ${{ steps.release_info.outputs.release_name }}
      release_title: ${{ steps.release_info.outputs.release_title }}
      commit_sha: ${{ steps.release_info.outputs.commit_sha }}
      timestamp: ${{ steps.release_info.outputs.timestamp }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate release info
        id: release_info
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          RELEASE_NAME="CI-${COMMIT_SHA}-${TIMESTAMP}"
          RELEASE_TITLE="CI Build ${COMMIT_SHA} (${TIMESTAMP})"

          echo "commit_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "release_name=${RELEASE_NAME}" >> $GITHUB_OUTPUT
          echo "release_title=${RELEASE_TITLE}" >> $GITHUB_OUTPUT

  build-linux:
    name: Build and Release Flatpak
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      IMAGE_TAG: tdesktop:centos_env

    steps:
      - name: Maximize Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Setup Swap and Docker Space
        run: |
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          # 建立 12G Swap
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          
          # 將 Docker 數據移到 /mnt 以免撐爆根目錄
          sudo mkdir -p /mnt/docker
          sudo bash -c 'echo "{\"data-root\": \"/mnt/docker\"}" > /etc/docker/daemon.json'
          sudo systemctl restart docker
          free -h
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Environment
        run: |
          sudo apt update
          curl -sSL https://install.python-poetry.org | python3 -
          export PATH="$HOME/.local/bin:$PATH"
          cd Telegram/build/docker/centos_env
          poetry install

          # 確保不使用 LTO
          DOCKERFILE=$(LTO= poetry run gen_dockerfile)
          echo "$DOCKERFILE" > Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            env.BUILDKIT_STEP_LOG_MAX_SIZE=10485760
            image=moby/buildkit:latest
          buildkitd-flags: --allow-insecure-entitlement network.host
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1

      - name: Build Environment Image
        uses: docker/build-push-action@v7
        with:
          context: Telegram/build/docker/centos_env
          load: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: ""
          cache-to: ""

      - name: Telegram Desktop build
        run: |
          # -e MAKEFLAGS="-j1" 防止記憶體爆炸
          # -D TDESKTOP_API_UNITY_BUILD=OFF 減少單個編譯進程的 RAM 需求
          docker run --rm \
            -u $(id -u) \
            -v $PWD:/usr/src/tdesktop \
            -e MAKEFLAGS="-j1" \
            $IMAGE_TAG \
            /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
              -D TDESKTOP_API_ID=${TDESKTOP_API_ID} \
              -D TDESKTOP_API_HASH=${TDESKTOP_API_HASH} \
              -D CMAKE_BUILD_TYPE=Release \
              -D CMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF \
              -D TDESKTOP_API_UNITY_BUILD=OFF \
              -D DESKTOP_APP_USE_PACKAGED_RLOTTIE=OFF

      - name: Check Binary
        run: |
          if [ -f out/Release/AyuGram ]; then
            echo "Build successful."
            ls -lh out/Release/AyuGram
          else
            echo "Build failed: Binary not found."
            exit 1
          fi

      - name: Install Flatpak SDK
        run: |
          sudo apt install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.gnome.Sdk//48 org.gnome.Platform//48

      - name: Build Flatpak
        run: |
          mkdir -p ayugram-flatpak-build
          cp out/Release/AyuGram ayugram-flatpak-build/
          if [ -d docs/assets/flatpak-files ]; then
            cp -r docs/assets/flatpak-files/* ayugram-flatpak-build/
          fi
          cd ayugram-flatpak-build
          flatpak-builder --repo=repo --force-clean --disable-rofiles-fuse build-dir com.ayugram.desktop.yml
          flatpak build-bundle repo ayugram-desktop.flatpak com.ayugram.desktop

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-linux-flatpak
          path: ayugram-flatpak-build/ayugram-desktop.flatpak
          retention-days: 7

  build-windows:
    runs-on: windows-2022
    needs: prepare-release

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Patch CMake Files
        shell: pwsh
        run: |
          # 1. 處理 options_win.cmake
          $optionsFile = "cmake/options_win.cmake"
          $optContent = Get-Content $optionsFile -Raw

          # 加入 /FS 參數
          $optContent = $optContent -replace '(/MP\s+# Enable multi process build\.)', "`$1`n                /FS"

          $oldExpr = '$<$<NOT:$<AND:$<CONFIG:Debug>,$<BOOL:${build_win64}>>>:$<IF:$<STREQUAL:$<GENEX_EVAL:$<TARGET_PROPERTY:MSVC_DEBUG_INFORMATION_FORMAT>>,ProgramDatabase>,/DEBUG,/DEBUG:NONE>>'
          $newExpr = '$<$<NOT:$<AND:$<CONFIG:Debug>,$<BOOL:${build_win64}>>>:$<IF:$<BOOL:$<GENEX_EVAL:$<TARGET_PROPERTY:MSVC_DEBUG_INFORMATION_FORMAT>>>,/DEBUG,/DEBUG:NONE>>'
          $optContent = $optContent.Replace($oldExpr, $newExpr)
          
          $optContent | Set-Content $optionsFile

          # 2. 處理 variables.cmake
          $varsFile = "cmake/variables.cmake"
          $varsContent = Get-Content $varsFile -Raw

          # 取代 Debug Information Format
          $oldVar = 'set(CMAKE_MSVC_DEBUG_INFORMATION_FORMAT "ProgramDatabase" CACHE STRING "")'
          $newVar = "set(CMAKE_MSVC_DEBUG_INFORMATION_FORMAT`n        `"`$<$<CONFIG:Debug,RelWithDebInfo>:ProgramDatabase>`$<$<CONFIG:Release,MinSizeRel>:Embedded>`"`n        CACHE STRING `"`" FORCE)"
          
          $varsContent = $varsContent.Replace($oldVar, $newVar)
          $varsContent | Set-Content $varsFile

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prepare build environment
        shell: cmd
        run: |
          cd Telegram\build\prepare
          call win.bat

      - name: Configure project
        shell: cmd
        run: |
          cd Telegram
          call configure.bat x64 -D TDESKTOP_API_ID=%TDESKTOP_API_ID% -D TDESKTOP_API_HASH=%TDESKTOP_API_HASH%

      - name: Build project
        shell: cmd
        run: |
          cmake --build out --config Release --target Telegram

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force
          Copy-Item out\Release\AyuGram.exe artifacts\AyuGram-windows-x64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-windows-x64
          path: artifacts/AyuGram-windows-x64.exe
          retention-days: 7

  build-macos:
    runs-on: macos-latest
    needs: prepare-release

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew install git automake cmake wget pkg-config gnu-tar ninja nasm meson

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Prepare build environment
        run: |
          cd Telegram/build/prepare
          ./mac.sh

      - name: Configure project
        run: |
          cd Telegram
          ./configure.sh -D TDESKTOP_API_ID=${{ env.TDESKTOP_API_ID }} -D TDESKTOP_API_HASH=${{ env.TDESKTOP_API_HASH }}

      - name: Build project
        run: |
          cd out
          xcodebuild -project Telegram.xcodeproj -scheme Telegram -configuration Release build

      - name: Prepare artifact
        run: |
          mkdir -p artifacts
          cp -r out/Release/AyuGram.app artifacts/
          cd artifacts
          zip -r AyuGram-macos.zip AyuGram.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-macos
          path: artifacts/AyuGram-macos.zip
          retention-days: 7

  create-release:
    runs-on: ubuntu-latest
    needs: [prepare-release, build-linux, build-windows, build-macos]

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.release_name }}
          name: ${{ needs.prepare-release.outputs.release_title }}
          prerelease: true
          files: |
            artifacts/AyuGram-linux-x86_64/AyuGram-linux-x86_64.flatpak
            artifacts/AyuGram-windows-x64/AyuGram-windows-x64.exe
            artifacts/AyuGram-macos/AyuGram-macos.zip
          body: |
            Automated CI build from commit ${{ needs.prepare-release.outputs.commit_sha }}

            Build timestamp: ${{ needs.prepare-release.outputs.timestamp }}

            **Artifacts:**
            - Linux x86_64 Flatpak package
            - Windows x64 executable
            - macOS Universal app (zipped)

            **Note:** These are automated CI builds and may be unstable. Use at your own risk.
          token: ${{ secrets.GITHUB_TOKEN }}
