name: Build macOS

on:
  workflow_dispatch:

env:
  TDESKTOP_API_ID: 2040
  TDESKTOP_API_HASH: b18441a1ff607e10a989891a5462e627

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" || true
          brew install git automake cmake wget pkg-config gnu-tar ninja nasm meson

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Prepare build environment
        run: |
          cd Telegram/build/prepare
          ./mac.sh

      - name: Configure project
        run: |
          cd Telegram
          ./configure.sh -D TDESKTOP_API_ID=${{ env.TDESKTOP_API_ID }} -D TDESKTOP_API_HASH=${{ env.TDESKTOP_API_HASH }}

      - name: Build project
        run: |
          cd out
          xcodebuild -project Telegram.xcodeproj -scheme Telegram -configuration Release build

      - name: Prepare artifact
        run: |
          mkdir -p artifacts
          cp -r out/Release/AyuGram.app artifacts/
          cd artifacts
          zip -r AyuGram-macos.zip AyuGram.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-macos
          path: artifacts/AyuGram-macos.zip
          retention-days: 7

      - name: Generate release info
        id: release_info
        run: |
          echo "commit_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "timestamp=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
          echo "release_name=CI-$(git rev-parse --short HEAD)-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        with:
          tag_name: ${{ steps.release_info.outputs.release_name }}
          name: "CI Build ${{ steps.release_info.outputs.commit_sha }} (${{ steps.release_info.outputs.timestamp }})"
          prerelease: true
          files: artifacts/AyuGram-macos.zip
          token: ${{ secrets.GITHUB_TOKEN }}
