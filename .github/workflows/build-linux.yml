name: Build AyuGram Flatpak

on:
  workflow_dispatch:

env:
  TDESKTOP_API_ID: 2040
  TDESKTOP_API_HASH: b18441a1ff607e10a989891a5462e627
  IMAGE_TAG: tdesktop:centos_env

jobs:
  build-and-release:
    name: Build and Release Flatpak
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Maximize Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Setup Swap and Docker Space
        run: |
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          # 建立 12G Swap
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          
          # 將 Docker 數據移到 /mnt 以免撐爆根目錄
          sudo mkdir -p /mnt/docker
          sudo bash -c 'echo "{\"data-root\": \"/mnt/docker\"}" > /etc/docker/daemon.json'
          sudo systemctl restart docker
          free -h
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Environment
        run: |
          sudo apt update
          curl -sSL https://install.python-poetry.org | python3 -
          export PATH="$HOME/.local/bin:$PATH"
          cd Telegram/build/docker/centos_env
          poetry install

          # 確保不使用 LTO
          DOCKERFILE=$(LTO= poetry run gen_dockerfile)
          echo "$DOCKERFILE" > Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            env.BUILDKIT_STEP_LOG_MAX_SIZE=10485760
            image=moby/buildkit:latest
          buildkitd-flags: --allow-insecure-entitlement network.host
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1

      - name: Build Environment Image
        uses: docker/build-push-action@v7
        with:
          context: Telegram/build/docker/centos_env
          load: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: ""
          cache-to: ""

      - name: Telegram Desktop build
        run: |
          # -e MAKEFLAGS="-j1" 防止記憶體爆炸
          # -D TDESKTOP_API_UNITY_BUILD=OFF 減少單個編譯進程的 RAM 需求
          docker run --rm \
            -u $(id -u) \
            -v $PWD:/usr/src/tdesktop \
            -e MAKEFLAGS="-j1" \
            $IMAGE_TAG \
            /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
              -D TDESKTOP_API_ID=${TDESKTOP_API_ID} \
              -D TDESKTOP_API_HASH=${TDESKTOP_API_HASH} \
              -D CMAKE_BUILD_TYPE=Release \
              -D CMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF \
              -D TDESKTOP_API_UNITY_BUILD=OFF \
              -D DESKTOP_APP_USE_PACKAGED_RLOTTIE=OFF

      - name: Check Binary
        run: |
          if [ -f out/Release/AyuGram ]; then
            echo "Build successful."
            ls -lh out/Release/AyuGram
          else
            echo "Build failed: Binary not found."
            exit 1
          fi

      - name: Install Flatpak SDK
        run: |
          sudo apt install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.gnome.Sdk//48 org.gnome.Platform//48

      - name: Build Flatpak
        run: |
          mkdir -p ayugram-flatpak-build
          cp out/Release/AyuGram ayugram-flatpak-build/
          if [ -d docs/assets/flatpak-files ]; then
            cp -r docs/assets/flatpak-files/* ayugram-flatpak-build/
          fi
          cd ayugram-flatpak-build
          flatpak-builder --repo=repo --force-clean --disable-rofiles-fuse build-dir com.ayugram.desktop.yml
          flatpak build-bundle repo ayugram-desktop.flatpak com.ayugram.desktop

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: "CI-${{ github.sha }}-${{ github.run_id }}"
          name: "AyuGram Linux Build"
          files: ayugram-flatpak-build/ayugram-desktop.flatpak
          token: ${{ secrets.GITHUB_TOKEN }}