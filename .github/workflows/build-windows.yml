name: Build Windows x64

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

env:
  TDESKTOP_API_ID: 2040
  TDESKTOP_API_HASH: b18441a1ff607e10a989891a5462e627

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prepare build environment
        shell: cmd
        run: |
          cd Telegram\build\prepare
          call win.bat

      - name: Apply MSVC PDB patch
        shell: pwsh
        run: |
          Set-Location Telegram\cmake
          @'
          diff --git a/options_win.cmake b/options_win.cmake
          index c2d66cf..ccceb53 100644
          --- a/options_win.cmake
          +++ b/options_win.cmake
          @@ -32,6 +32,7 @@ if (MSVC)
                /utf-8
                /W4
                /MP     # Enable multi process build.
          +        /FS
                /EHsc   # Catch C++ exceptions only, extern C functions never throw a C++ exception.
                /w15038 # wrong initialization order
                /w14265 # class has virtual functions, but destructor is not virtual
          @@ -64,7 +65,7 @@ if (MSVC)
            INTERFACE
                $<$<CONFIG:Debug>:/NODEFAULTLIB:LIBCMT>
                $<$<AND:$<CONFIG:Debug>,$<BOOL:${build_win64}>>:/DEBUG:FASTLINK>
          -        $<$<NOT:$<AND:$<CONFIG:Debug>,$<BOOL:${build_win64}>>>:$<IF:$<STREQUAL:$<GENEX_EVAL:
          $<TARGET_PROPERTY:MSVC_DEBUG_INFORMATION_FORMAT>>,ProgramDatabase>,/DEBUG,/DEBUG:NONE>>
          +        $<$<NOT:$<AND:$<CONFIG:Debug>,$<BOOL:${build_win64}>>>:$<IF:$<BOOL:$<GENEX_EVAL:
          $<TARGET_PROPERTY:MSVC_DEBUG_INFORMATION_FORMAT>>>,/DEBUG,/DEBUG:NONE>>
                $<$<NOT:$<CONFIG:Debug>>:/OPT:REF>
                /INCREMENTAL:NO
                /DEPENDENTLOADFLAG:0x800
          diff --git a/variables.cmake b/variables.cmake
          index d6ac6c5..b2f492a 100644
          --- a/variables.cmake
          +++ b/variables.cmake
          @@ -21,7 +21,9 @@ if (DESKTOP_APP_SPECIAL_TARGET STREQUAL ""
          endif()

          set(CMAKE_CXX_SCAN_FOR_MODULES OFF CACHE BOOL "")
          -set(CMAKE_MSVC_DEBUG_INFORMATION_FORMAT "ProgramDatabase" CACHE STRING "")
          +set(CMAKE_MSVC_DEBUG_INFORMATION_FORMAT
          +    "$<$<CONFIG:Debug,RelWithDebInfo>:ProgramDatabase>$<$<CONFIG:Release,MinSizeRel>:Embedded>"
          +    CACHE STRING "" FORCE)
          set(CMAKE_MSVC_RUNTIME_LIBRARY "MultiThreaded$<$<CONFIG:Debug>:Debug>" CACHE STRING "")
          option(DESKTOP_APP_TEST_APPS "Build test apps, development only." OFF)
          option(DESKTOP_APP_LOTTIE_DISABLE_RECOLORING "Disable recoloring of lottie animations." OFF)
          '@ | git -C cmake apply -

      - name: Configure project
        shell: cmd
        run: |
          cd Telegram
          call configure.bat x64 -D TDESKTOP_API_ID=%TDESKTOP_API_ID% -D TDESKTOP_API_HASH=%TDESKTOP_API_HASH%

      - name: Build project
        shell: cmd
        run: |
          cmake --build out --config Release --target Telegram

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force
          Copy-Item out\Release\AyuGram.exe artifacts\AyuGram-windows-x64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-windows-x64
          path: artifacts/AyuGram-windows-x64.exe
          retention-days: 7

      - name: Generate release info
        id: release_info
        shell: pwsh
        run: |
          $commitSha = git rev-parse --short HEAD
          $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"
          $releaseName = "CI-$commitSha-$timestamp"
          echo "commit_sha=$commitSha" >> $env:GITHUB_OUTPUT
          echo "timestamp=$timestamp" >> $env:GITHUB_OUTPUT
          echo "release_name=$releaseName" >> $env:GITHUB_OUTPUT

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        with:
          tag_name: ${{ steps.release_info.outputs.release_name }}
          name: "CI Build ${{ steps.release_info.outputs.commit_sha }} (${{ steps.release_info.outputs.timestamp }})"
          prerelease: true
          files: artifacts/AyuGram-windows-x64.exe
          token: ${{ secrets.GITHUB_TOKEN }}
